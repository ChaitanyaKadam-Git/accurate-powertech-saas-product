# Used by .github/workflows/deploy.yml on the server. Images come from GHCR; .env is written by the workflow.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: quotes
      POSTGRES_USER: quotes
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotes -d quotes"]
      interval: 10s
      retries: 5
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/quotes
      DB_USER: quotes
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PROXY_HOPS: ${PROXY_HOPS:-1}
      STORAGE: local
    volumes: [uploads:/app/uploads]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on: [backend]
volumes:
  pgdata:
  uploads:
