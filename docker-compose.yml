services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: quotes
      POSTGRES_USER: quotes
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/quotes
      DB_USER: quotes
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: http://localhost
      STORAGE: local
    volumes: [uploads:/app/uploads]
    depends_on: [db]
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports: ["80:80"]
    depends_on: [backend]
volumes:
  pgdata:
  uploads:
