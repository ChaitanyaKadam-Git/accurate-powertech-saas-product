server:
  port: 8080
  error.include-message: always
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quotes}
    username: ${DB_USER:quotes}
    password: ${DB_PASS:quotes}
  jpa:
    hibernate.ddl-auto: update   # MVP only. Move to Flyway before real production data.
    open-in-view: true
  servlet.multipart:
    max-file-size: 20MB
    max-request-size: 20MB
  jackson.deserialization.fail-on-unknown-properties: false
app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32chars}
    ttl-minutes: 480
  cors: ${CORS_ORIGINS:http://localhost:4200}
  proxy-hops: ${PROXY_HOPS:1}         # proxies in front of the backend (nginx or ALB = 1, ALB then nginx = 2); used for the IP in the activity log
  storage: ${STORAGE:local}          # local | s3
  local-dir: ${LOCAL_DIR:./uploads}
  s3.bucket: ${S3_BUCKET:}
management.endpoints.web.exposure.include: health
