server:
  port: 8080
  error.include-message: always
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quotes}
    username: ${DB_USER:quotes}
    password: ${DB_PASS:quotes}
  jpa:
    hibernate.ddl-auto: validate   # schema changes go through Flyway (src/main/resources/db/migration)
    open-in-view: true
  servlet.multipart:
    max-file-size: 20MB
    max-request-size: 20MB
  flyway:
    baseline-on-migrate: true   # databases created before Flyway already have the V1 schema: mark them as version 1
    baseline-version: 1
  jackson.deserialization.fail-on-unknown-properties: false
app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32chars}
    ttl-minutes: 480
  cors: ${CORS_ORIGINS:http://localhost:4200}
  proxy-hops: ${PROXY_HOPS:1}         # proxies in front of the backend (nginx or ALB = 1, ALB then nginx = 2); used for the IP in the activity log
  storage: ${STORAGE:local}          # local | s3
  local-dir: ${LOCAL_DIR:./uploads}
  s3.bucket: ${S3_BUCKET:}
  seed:                              # first company + Admin at start-up (SeedAdmin); skipped when unset or the email exists
    admin-email: ${SEED_ADMIN_EMAIL:}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    admin-name: ${SEED_ADMIN_NAME:}
    company-name: ${SEED_COMPANY_NAME:Accurate Powertech}
management.endpoints.web.exposure.include: health
