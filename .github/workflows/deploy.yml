name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: Build and push images
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.names.outputs.backend }}
      frontend: ${{ steps.names.outputs.frontend }}
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Image names (GHCR needs lowercase)
        id: names
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=$base-backend:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "frontend=$base-frontend:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=$base-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ github.sha }}
            ${{ steps.names.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Short-SHA tag used by the server's compose file
      - name: Add short tag
        run: |
          docker buildx imagetools create \
            -t "${{ steps.names.outputs.image }}:${GITHUB_SHA::12}" \
            "${{ steps.names.outputs.image }}:${{ github.sha }}"

  deploy:
    name: Deploy to server
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/accurate-powertech' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS not set; trusting host key from ssh-keyscan"
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User ${{ secrets.SSH_USER }}
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          EOF

      - name: Write .env for server
        env:
          DB_PASS: ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'http://localhost' }}
          PROXY_HOPS: ${{ vars.PROXY_HOPS || '1' }}
          HTTP_PORT: ${{ vars.HTTP_PORT || '80' }}
        run: |
          umask 077
          {
            echo "BACKEND_IMAGE=${{ needs.images.outputs.backend }}"
            echo "FRONTEND_IMAGE=${{ needs.images.outputs.frontend }}"
            echo "DB_PASS=$DB_PASS"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "CORS_ORIGINS=$CORS_ORIGINS"
            echo "PROXY_HOPS=$PROXY_HOPS"
            echo "HTTP_PORT=$HTTP_PORT"
          } > deploy.env

      - name: Copy files
        run: |
          ssh server "mkdir -p $DEPLOY_PATH"
          scp docker-compose.prod.yml "server:$DEPLOY_PATH/docker-compose.yml"
          scp deploy.env "server:$DEPLOY_PATH/.env"
          ssh server "chmod 600 $DEPLOY_PATH/.env"

      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh server "bash -se" <<EOF
          set -euo pipefail
          cd $DEPLOY_PATH
          echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose pull
          docker compose up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -f
          docker compose ps
          EOF

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy deploy.env
